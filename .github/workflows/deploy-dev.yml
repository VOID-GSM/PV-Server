name: Deploy dev (school server)

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/void-gsm/pv-backend
  TAG: ${{ github.sha }}

jobs:
  build:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          cache-from: type=gha,scope=dev
          cache-to: type=gha,scope=dev,mode=max
  deploy:
    needs: build
    runs-on: [self-hosted, pv-dev]
    environment: dev
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_DIR: /srv/pv-dev
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docker-compose.yml
            deploy/dev
          sparse-checkout-cone-mode: false

      - name: Copy compose files
        run: |
          cp docker-compose.yml "$DEPLOY_DIR/docker-compose.yml"
          cp deploy/dev/docker-compose.override.yml "$DEPLOY_DIR/docker-compose.override.yml"
          cp deploy/dev/nginx.conf.template "$DEPLOY_DIR/nginx.conf.template"
          test -f "$DEPLOY_DIR/.env" || { echo "$DEPLOY_DIR/.env 없음 (서버에서 직접 만들어야 함)" >&2; exit 1; }

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy (rollback on failure)
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          prev="$(cat .backend_tag 2>/dev/null || true)"

          deploy() {
            export BACKEND_IMAGE="$IMAGE:$1"
            docker pull -q "$BACKEND_IMAGE"
            docker compose up -d --no-build --remove-orphans --wait --wait-timeout 300
          }

          # 파일 스토리지(MinIO) 먼저 띄우고 버킷 없으면 생성
          docker compose up -d --wait minio
          docker compose --profile init run --rm storage-init

          if deploy "$TAG"; then
            # nginx 템플릿은 컨테이너 시작 시에만 치환되므로 게이트웨이만 재생성 (dev라 1초 끊김 허용)
            docker compose up -d --no-deps --force-recreate gateway
            echo "$TAG" > .backend_tag
            docker image prune -af --filter "until=72h" > /dev/null
            echo "deployed $TAG"
            exit 0
          fi

          echo "!!! deploy failed: $TAG" >&2
          docker compose logs --tail 80 backend || true
          if [ -n "$prev" ]; then
            deploy "$prev" && echo "rolled back to $prev" >&2
          fi
          exit 1

      - name: Discord notify
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_SERVER_WEBHOOK }}
          title: ${{ job.status == 'success' && '🧪 dev 배포 성공' || '❌ dev 배포 실패' }}
          description: ${{ format('develop@{0} → 학교 서버', github.sha) }}