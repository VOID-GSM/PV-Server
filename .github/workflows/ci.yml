name: CI

on:
  pull_request:
    branches: ["main", "develop"]
  push:
    branches: ["main", "develop"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Gradle 준비 (재시도)
        run: |
          for i in 1 2 3; do
            ./gradlew --version && exit 0
            echo "Gradle 다운로드 실패 ($i/3), 30초 후 재시도"
            sleep 30
          done
          exit 1

      - name: Build
        run: ./gradlew build

      - name: Discord notify
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_SERVER_WEBHOOK }}
          title: ${{ job.status == 'success' && '✅ 성공 ✅' || '❌ 실패 ❌' }}
          description: ${{ job.status == 'success' && '빌드 성공' || '빌드 실패' }}