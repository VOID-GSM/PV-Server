name: Deploy to EC2

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      INSTANCE_ID: ${{ vars.INSTANCE_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Upload source to S3
        run: aws s3 sync . "s3://${{ vars.OPS_BUCKET }}/deploy/backend/" --delete --exclude ".git/*" --exclude ".data/*" --exclude ".env" --only-show-errors

      - name: Build & restart on EC2 (SSM)
        run: |
          id=$(aws ssm send-command --document-name pv-deploy --instance-ids "$INSTANCE_ID" \
            --query Command.CommandId --output text)
          for _ in $(seq 90); do
            sleep 10
            s=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            [[ $s =~ ^(Pending|InProgress|Delayed)$ ]] || break
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          [ "$s" = Success ]

      - name: Discord notify
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_SERVER_WEBHOOK }}
          title: ${{ job.status == 'success' && '🚀 배포 성공 🚀' || '❌ 배포 실패 ❌' }}
          description: ${{ job.status == 'success' && format('{0} 브랜치 EC2 배포 완료', github.ref_name) || format('{0} 브랜치 EC2 배포 실패. Actions 로그 확인', github.ref_name) }}