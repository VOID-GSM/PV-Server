spring.application.name=PV

# DB 접속
spring.datasource.url=jdbc:postgresql://localhost:5432/pv_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
server.port=8081

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-expiration-ms=3600000

# 파일 스토리지 (S3 호환)
storage.bucket=${STORAGE_BUCKET:pv-files}
storage.region=${STORAGE_REGION:ap-northeast-2}
storage.endpoint=${STORAGE_ENDPOINT:http://localhost:9000}
storage.public-endpoint=${STORAGE_PUBLIC_ENDPOINT:}
storage.path-style=${STORAGE_PATH_STYLE:true}
storage.max-size=50MB
storage.upload-url-ttl=10m
storage.download-url-ttl=10m
storage.allowed-content-types=image/png,image/jpeg,image/gif,image/webp,application/pdf,application/zip,text/plain,text/markdown